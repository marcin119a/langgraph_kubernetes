apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-bank-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-bank-bot
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
