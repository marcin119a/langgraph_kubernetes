apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-bank-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-bank-bot
  template:
    metadata:
      labels:
        app: voice-bank-bot
    spec:
      containers:
        - name: voice-bank-bot
          image: voice-bank-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8020
          envFrom:
            - secretRef:
                name: voice-bank-bot-secrets
            - configMapRef:
                name: voice-bank-bot-config
          env:
            - name: FAQ_PATH
              value: /app/faq/faq.md
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: { path: /health, port: 8020 }
            initialDelaySeconds: 2
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: 8020 }
            initialDelaySeconds: 2
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /health, port: 8020 }
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
            - name: faq
              mountPath: /app/faq # osobny katalog w którym mamy faq.md z ConfigMap
      volumes:
        - name: faq
          configMap:
            name: voice-bank-bot-faq
        - name: uploads
          persistentVolumeClaim:
            claimName: voice-bank-bot-uploads
